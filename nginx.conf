# The cladex-proxy service in compose.yaml: owns :8090 (where FRP and LAN users connect)
# and passes every request to whichever blue/green slot is up. A slot that is down
# refuses the connection, and nginx retries on the other one — that retry is the whole
# zero-downtime mechanism, so deploy.sh never has to edit or reload this file.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    # The app logs every request itself (docker compose logs cladex-blue cladex-green).
    access_log off;
    server_tokens off;

    # The app caps uploads at 25 MB; the VPS's nginx allows 30 MB, so match it.
    client_max_body_size 30m;

    upstream cladex {
        # max_fails=0: never bench a slot. Benching the idle one would still be in force
        # when deploy.sh starts it and stops the other, leaving no live upstream (502s
        # for up to fail_timeout). Trying a stopped slot costs one refused connection on
        # localhost, microseconds, before the retry.
        server 127.0.0.1:8092 max_fails=0;  # cladex-blue
        server 127.0.0.1:8093 max_fails=0;  # cladex-green
    }

    server {
        listen 8090;

        location / {
            proxy_pass http://cladex;

            # Retry on the other slot when a connection is refused or doesn't open.
            # nginx never resends a POST it already passed to a slot, so this can't
            # double-submit a form; the request body is buffered, so a refused POST can
            # be retried.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;

            # The app's own ReadTimeout is 5 min (uploads), and PDF rendering and PAC
            # calls have no write timeout; don't cut either off here.
            proxy_read_timeout 5m;
            proxy_send_timeout 5m;

            # Keep what the app saw before this proxy existed: the Host the browser sent
            # (CrossOriginProtection compares it with Origin), the client's IP first in
            # X-Forwarded-For (clientIP: rate limiting and the access log), and the VPS's
            # X-Forwarded-Proto.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # No slot up: deploy.sh paused production for an exclusive migration. nginx
            # itself answers 502 then; show a maintenance page instead. A 502 the app
            # sends passes through as is (proxy_intercept_errors is off), and htmx
            # doesn't swap a 503 into the page.
            error_page 502 =503 @actualizando;
        }

        location @actualizando {
            default_type "text/html; charset=utf-8";
            add_header Retry-After 10 always;
            add_header Cache-Control no-store always;
            return 503 '<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="10"><title>Actualizando Cladex</title>
<style>body{font-family:system-ui,sans-serif;max-width:32rem;margin:20vh auto;padding:0 1rem;color:#222;line-height:1.5}</style>
</head><body><h1>Estamos actualizando Cladex</h1>
<p>Vuelve en unos segundos: esta página se recarga sola. Si estabas guardando algo, revisa al volver si quedó guardado.</p>
</body></html>
';
        }
    }
}
